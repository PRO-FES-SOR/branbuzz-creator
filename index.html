<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BranBuzz — Connect, Create, Earn</title>
  <meta name="description" content="Join BranBuzz to collaborate with brands, create content, and earn money through product reviews and reels." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7C3AED" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/auth.css" />
</head>
<body>
  <div class="auth-page">
    <!-- Animated background orbs -->
    <div class="auth-bg-orb"></div>
    <div class="auth-bg-orb"></div>
    <div class="auth-bg-orb"></div>

    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="/BranBuzz.png" alt="BranBuzz Logo" class="logo-img" style="height: 64px; width: 200px; object-fit: cover; object-position: left center; margin: 0 auto 12px auto; display: block;" />
          <p>Create content. Earn rewards.</p>
        </div>

        <!-- Tabs: Sign In / Sign Up -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-signin" data-tab="signin">Sign In</button>
          <button class="auth-tab" id="tab-signup" data-tab="signup">Sign Up</button>
        </div>

        <!-- Sign In Form -->
        <form class="auth-form" id="signin-form">
          <button type="button" class="btn btn-google w-full" id="signin-google-btn" style="margin-bottom: var(--space-md);">
            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
          
          <div class="auth-divider">OR</div>
          
          <div class="form-group">
            <label class="form-label" for="signin-email">Email Address</label>
            <input type="email" id="signin-email" class="form-input" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="signin-password">Password</label>
            <input type="password" id="signin-password" class="form-input" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-full" id="signin-btn">
            Sign In with Email
          </button>
        </form>

        <!-- Sign Up Form -->
        <form class="auth-form hidden" id="signup-form">
          <button type="button" class="btn btn-google w-full" id="signup-google-btn" style="margin-bottom: var(--space-md);">
            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
          
          <div class="auth-divider">OR</div>
          
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-input" placeholder="Min 8 characters" required minlength="8" />
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-full" id="signup-btn">
            Create Account
          </button>
        </form>

        <!-- Legal and Admin links -->
        <div style="font-size: 0.75rem; color: var(--color-text-muted); text-align: center; margin-top: var(--space-lg); margin-bottom: var(--space-md);">
          By continuing, you agree to the BranBuzz <a href="#" id="tnc-link" style="color: var(--color-accent-violet); text-decoration: none; font-weight: 600;">Terms & Conditions</a>.
        </div>
        <div class="auth-admin-link">
          <a href="/admin.html">Admin Login →</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="/src/pages/creator/auth.js"></script>
</body>
</html>
