<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — BranBuzz</title>
  <meta name="description" content="Browse products, manage your orders, and earn through content creation." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/creator.css" />
  <link rel="stylesheet" href="/src/styles/chat.css" />
</head>
<body>
  <!-- Page Loader -->
  <div class="page-loader" id="page-loader">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <nav class="creator-nav" id="creator-nav">
    <div class="nav-logo">
      <img src="/BranBuzz.png" alt="BranBuzz Logo" class="logo-img" style="height: 36px; width: 140px; object-fit: cover; object-position: left center;" />
    </div>
    <div class="nav-actions">
      <div class="nav-user">
        <div class="nav-avatar" id="nav-avatar"></div>
        <button class="btn btn-sm btn-logout" id="logout-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Floating Tab Bar -->
  <div class="floating-tabs-container">
    <div class="floating-tabs">
      <button class="floating-tab active" data-section="products" id="nav-products">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </button>
      <button class="floating-tab" data-section="orders" id="nav-orders">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        My Orders <span class="tab-count" id="orders-count" style="display:none">0</span>
      </button>
      <button class="floating-tab" data-section="inbox" id="nav-inbox">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Chat <span class="tab-count" id="inbox-count" style="display:none">0</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="creator-main">
    <!-- Products Section -->
    <section id="section-products">
      
      <!-- Promotional Banner -->
      <div class="creator-hero-image" style="margin-bottom: var(--space-lg); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);">
        <picture>
          <source media="(min-width: 768px)" srcset="https://cdn.shopify.com/s/files/1/0620/4319/3446/files/ChatGPT_Image_Jul_2_2026_11_27_46_AM.png?v=1782971961">
          <img src="https://cdn.shopify.com/s/files/1/0620/4319/3446/files/ChatGPT_Image_Jul_2_2026_11_41_52_AM.png?v=1782975810" alt="BrandBuzz Special Offer" style="width: 100%; height: auto; display: block; object-fit: cover;">
        </picture>
      </div>

      <div class="hero-header">
        <div class="hero-icon-box">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </div>
        <div class="hero-title">
          <h1>Browse Products</h1>
          <p>Select a product to get started. Purchase, review, create — and earn!</p>
        </div>
      </div>



      <div class="section-title-row">
        <div class="section-title-left">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#7C3AED" stroke="none"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6-6.2-4.5-6.2 4.5 2.4-7.6-6.2-4.5h7.6z"/></svg>
          <h2>Featured Product</h2>
        </div>
        <a href="#" class="view-all-link">View all <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
      </div>

      <div class="product-list" id="product-grid">
        <!-- Products loaded dynamically -->
        <div class="empty-state" id="products-loading">
          <div class="spinner" style="margin: 0 auto var(--space-md);"></div>
          <p>Loading products...</p>
        </div>
      </div>
    </section>

    <!-- My Orders Section -->
    <section id="section-orders" class="hidden">
      <div class="page-header">
        <h1>📋 My Orders</h1>
        <p>Track your active collaborations and submissions</p>
      </div>

      <div class="section-tabs" id="order-tabs">
        <button class="section-tab active" data-filter="all">All</button>
        <button class="section-tab" data-filter="active">Active</button>
        <button class="section-tab" data-filter="pending">Pending Action</button>
        <button class="section-tab" data-filter="completed">Completed</button>
      </div>

      <div class="orders-list" id="orders-list">
        <div class="empty-state" id="orders-empty">
          <div class="empty-icon">📦</div>
          <h3>No orders yet</h3>
          <p>Browse products and apply to start earning!</p>
        </div>
      </div>
    </section>

    <!-- Inbox Section -->
    <section id="section-inbox" class="hidden">
      <div class="chat-container">
        <!-- Main Chat Area for Creator -->
        <div class="chat-main" style="width: 100%;">
          <div class="chat-header">
            <div class="contact-avatar" style="width: 36px; height: 36px; margin-right: 12px; background: transparent;">
              <img src="/favicon.png" alt="Support" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
            </div>
            <div>
              <h3>Support</h3>
              <div style="font-size: 0.75rem; color: var(--color-text-muted);">BranBuzz Support</div>
            </div>
          </div>
          <div class="chat-messages" id="creator-chat-messages">
            <!-- Messages dynamically loaded here -->
          </div>
          <div class="chat-input-area">
            <input type="text" class="chat-input" id="creator-chat-input" placeholder="Type a message..." autocomplete="off" />
            <button class="btn-send" id="creator-chat-send" title="Send">
              <img src="/send.png" style="width: 20px; height: 20px; object-fit: contain; margin-left: -2px; margin-top: 2px;" alt="Send" />
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Floating Support Button -->
  <button id="floating-support-btn" class="floating-support-btn" aria-label="Contact Support">
    <img src="/chat.gif" alt="Support Bot" />
  </button>

  <div id="toast-container"></div>

  <script type="module" src="/src/pages/creator/dashboard.js"></script>
</body>
</html>
